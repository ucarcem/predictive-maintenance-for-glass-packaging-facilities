# ==============================================================================
# CAM AMBALAJ ÜRETİM HATTI GENEL VE EKİPMAN YAPILANDIRMASI (line_config.yaml)
# ==============================================================================

# --- HAT GENEL FİNANSAL VE OPERASYONEL PARAMETRELERİ ---
line_settings:
  line_stoppage_cost: 15000     # C_hat_durus: Günlük net üretim kaybı / ceza ($)
  total_technicians: 100        # Fabrikada aynı anda çalışabilecek max bakım teknisyeni
  planning_horizon_days: 28     # MILP optimizasyon kayan ufuk süresi (gün)
  blackout_days_per_week: 2     # Her 7 günde bir rastgele konacak duruş yasağı gün sayısı

# --- EKİPMAN ENVANTERİ VE SENSÖR PARAMETRELERİ ---
# is_hot_section: true  -> Sıcak bölge (Duruş yaptığında TÜM hat durur, Z_k = 1 zorunlu)
# is_hot_section: false -> Soğuk bölge (Tampon masaları sayesinde kısa duruşlar hattı kilitlemeyebilir)
# workers_needed: W_i   -> Bu makinenin bakımında gereken teknisyen sayısı
# lead_time_days: LT_i  -> Gerekli yedek parçanın ambara teslim süresi (gün)
# cost_maint: C_bakim   -> Planlı parça + işçilik maliyeti ($)
# cost_damage: C_hasar  -> Plansız arıza, kırık cam, ikincil hasar ve acil tamir maliyeti ($)

